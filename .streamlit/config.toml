# findJob 화면 테마 — 엑셀 파일과 같은 남색 계열로 맞춤
[theme]
base = "light"
primaryColor = "#2F5597"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
linkColor = "#2F5597"
font = "'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
headingFont = "'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
baseFontSize = 14
baseRadius = "0.6rem"
borderColor = "#DDE3EE"
dataframeBorderColor = "#E5E9F2"
dataframeHeaderBackgroundColor = "#EEF2F9"
showWidgetBorder = true

[client]
# 오른쪽 위 Deploy 버튼 등 개발용 메뉴를 숨긴다
toolbarMode = "minimal"
