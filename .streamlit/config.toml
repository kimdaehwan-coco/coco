# findJob 화면 테마
# 역할별 색: 남색 = 제목·구조 / 녹색 = 눌러서 실행하는 핵심 동작 / 파랑 = 링크 / 붉은색 = 제외
[theme]
base = "light"
primaryColor = "#15803D"
backgroundColor = "#F3F5F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2233"
linkColor = "#1E5BB8"
font = "Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
headingFont = "Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif"
baseFontSize = 16
baseRadius = "0.6rem"
borderColor = "#D5DBE6"
dataframeBorderColor = "#DCE2EC"
dataframeHeaderBackgroundColor = "#E3E8F1"
showWidgetBorder = true

[client]
# 오른쪽 위 Deploy 버튼 등 개발용 메뉴를 숨긴다
toolbarMode = "minimal"
